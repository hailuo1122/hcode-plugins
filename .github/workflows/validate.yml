name: Validate plugin entries

on:
  pull_request:
    paths:
      - "plugins/**"
      - "scripts/**"
      - "schema/**"
      - "marketplace.meta.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-entry.mjs
