name: Build marketplace index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "marketplace.meta.json"
      - "scripts/build-marketplace.mjs"
  schedule:
    - cron: "17 4 * * *" # 每天 04:17 UTC：刷新 README 里的星标/最近更新
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rebuild marketplace.json and README table
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKETPLACE_ENRICH: "1"
        run: node scripts/build-marketplace.mjs
      - name: Commit generated files if changed
        run: |
          git config user.name "hcode-community-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json README.md
          if git diff --cached --quiet; then
            echo "Index already up to date."
          else
            git commit -m "chore: rebuild marketplace index [skip ci]"
            git push
          fi
